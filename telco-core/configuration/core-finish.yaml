---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: core-customer-policies
policyDefaults:
  namespace: ztp-core-policies
  policySets: []
  placement:
    clusterSelectors:
      common: "core"
      version: "4.18"
  remediationAction: "inform"
policies:
  # unpause baseline configuration
  - name: custom-mcp-unpause
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "200"
    manifests:
      # The MCPs should be added as extra manifests at installation time. Their
      # inclusion here will reset the pause to false, allowing the MCPs to update
      - path: reference-crs/custom-manifests/mcp.yaml
        patches:
        - metadata:
            name: worker-1
            labels:
              machineconfiguration.openshift.io/role: worker-1
          spec:
            paused: false
            maxUnavailable: 100%
            machineConfigSelector:
              matchExpressions:
              - key: machineconfiguration.openshift.io/role
                operator: In
                values: [ worker, worker-1 ]
            nodeSelector:
              matchLabels:
                node-role.kubernetes.io/worker-1: ""
          status:
            conditions:
            - type: Updated
              status: "True"
            - type: Updating
              status: "False"

      - path: reference-crs/custom-manifests/mcp.yaml
        patches:
        - metadata:
            name: worker-2
            labels:
              machineconfiguration.openshift.io/role: worker-2
          spec:
            paused: false
            maxUnavailable: 100%
            machineConfigSelector:
              matchExpressions:
              - key: machineconfiguration.openshift.io/role
                operator: In
                values: [ worker, worker-2 ]
            nodeSelector:
              matchLabels:
                node-role.kubernetes.io/worker-2: ""
          status:
            conditions:
            - type: Updated
              status: "True"
            - type: Updating
              status: "False"

      - path: reference-crs/custom-manifests/mcp.yaml
        patches:
        - metadata:
            name: worker-3
            labels:
              machineconfiguration.openshift.io/role: worker-3
          spec:
            paused: false
            maxUnavailable: 100%
            machineConfigSelector:
              matchExpressions:
              - key: machineconfiguration.openshift.io/role
                operator: In
                values: [ worker, worker-3 ]
            nodeSelector:
              matchLabels:
                node-role.kubernetes.io/worker-3: ""
          status:
            conditions:
            - type: Updated
              status: "True"
            - type: Updating
              status: "False"

  - name: core-custom-mcp-set-maxavailable
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "201"
    manifests:
      # This sets the desired maxUnavailable on the customMCPs
      - path: reference-crs/custom-manifests/mcp.yaml
        patches:
        - metadata:
            name: worker-1
            labels:
              machineconfiguration.openshift.io/role: worker-1
          spec:
            paused: false
            maxUnavailable: 1
            machineConfigSelector:
              matchExpressions:
              - key: machineconfiguration.openshift.io/role
                operator: In
                values: [ worker, worker-1 ]
            nodeSelector:
              matchLabels:
                node-role.kubernetes.io/worker-1: ""

      - path: reference-crs/custom-manifests/mcp.yaml
        patches:
        - metadata:
            name: worker-2
            labels:
              machineconfiguration.openshift.io/role: worker-2
          spec:
            paused: false
            maxUnavailable: 1
            machineConfigSelector:
              matchExpressions:
              - key: machineconfiguration.openshift.io/role
                operator: In
                values: [ worker, worker-2 ]
            nodeSelector:
              matchLabels:
                node-role.kubernetes.io/worker-2: ""

      - path: reference-crs/custom-manifests/mcp.yaml
        patches:
        - metadata:
            name: worker-3
            labels:
              machineconfiguration.openshift.io/role: worker-3
          spec:
            paused: false
            maxUnavailable: 1
            machineConfigSelector:
              matchExpressions:
              - key: machineconfiguration.openshift.io/role
                operator: In
                values: [ worker, worker-3 ]
            nodeSelector:
              matchLabels:
                node-role.kubernetes.io/worker-3: ""
